# ============================================
# Phase 6: Final verification
# ============================================
- name: Verify federation configuration on az-cluster-2
  hosts: pve-schwab-rmq04
  become: true
  tasks:
    - name: List exchanges
      ansible.builtin.command: rabbitmqctl list_exchanges name type
      register: exchanges
      changed_when: false

    - name: Display exchanges
      ansible.builtin.debug:
        msg: "{{ exchanges.stdout_lines }}"

    - name: List queues
      ansible.builtin.command: rabbitmqctl list_queues name type
      register: queues
      changed_when: false

    - name: Display queues
      ansible.builtin.debug:
        msg: "{{ queues.stdout_lines }}"

    - name: List policies
      ansible.builtin.command: rabbitmqctl list_policies
      register: policies
      changed_when: false

    - name: Display policies
      ansible.builtin.debug:
        msg: "{{ policies.stdout_lines }}"

    - name: Check federation links via rabbitmqctl
      ansible.builtin.command: rabbitmqctl list_parameters
      register: fed_params
      changed_when: false

    - name: Display federation parameters
      ansible.builtin.debug:
        msg: "{{ fed_params.stdout_lines }}"

- name: Verify federation configuration on tx-cluster-1
  hosts: pve-schwab-rmq07
  become: true
  tasks:
    - name: List exchanges
      ansible.builtin.command: rabbitmqctl list_exchanges name type
      register: exchanges
      changed_when: false

    - name: Display exchanges
      ansible.builtin.debug:
        msg: "{{ exchanges.stdout_lines }}"

    - name: List queues
      ansible.builtin.command: rabbitmqctl list_queues name type
      register: queues
      changed_when: false

    - name: Display queues
      ansible.builtin.debug:
        msg: "{{ queues.stdout_lines }}"

    - name: List policies
      ansible.builtin.command: rabbitmqctl list_policies
      register: policies
      changed_when: false

    - name: Display policies
      ansible.builtin.debug:
        msg: "{{ policies.stdout_lines }}"

    - name: Check federation links via rabbitmqctl
      ansible.builtin.command: rabbitmqctl list_parameters
      register: fed_params
      changed_when: false

    - name: Display federation parameters
      ansible.builtin.debug:
        msg: "{{ fed_params.stdout_lines }}"

- name: Final verification summary
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Show completion message
      ansible.builtin.debug:
        msg:
          - "============================================"
          - "Federation Configuration Complete"
          - "============================================"
          - ""
          - "Upstream cluster (az-cluster-1):"
          - "  - Exchange: federation-upstream-exchange (fanout)"
          - "  - Queue: federation-upstream-queue (quorum)"
          - ""
          - "Downstream clusters (az-cluster-2, tx-cluster-1):"
          - "  - Federated Exchange: federation-upstream-exchange"
          - "  - Queue: federation-downstream-queue (quorum)"
          - ""
          - "Messages published to federation-upstream-exchange on az-cluster-1"
          - "will be automatically forwarded to downstream clusters."
          - ""
          - "To test, run:"
          - "  ./perf-tests/test-resiliency-federation.sh"
