---
# Network Latency Simulation for Tanzu RabbitMQ Cluster
# 
# This playbook simulates a multi-region/multi-AZ environment:
# - Metro Latency (Within Region): ~3ms delay
# - Cross-Region Latency (Between Regions): ~35ms delay
# - SSH Traffic (Port 22): 0ms (Bypasses latency to prevent disconnects)

- name: Configure Network Latency Simulation
  hosts: nodes
  become: true
  # Process nodes one by one to prevent SSH saturation during network changes
  serial: 1 
  vars:
    # Increase SSH resilience for network-unstable tasks
    ansible_ssh_extra_args: "-o ConnectTimeout=30 -o ControlMaster=auto -o ControlPersist=60s -o ConnectionAttempts=5"

  tasks:
    - name: Install iproute-tc and iptables
      ansible.builtin.dnf:
        name: 
          - iproute-tc
          - iptables-services
        state: present

    - name: Mark SSH traffic using iptables mangle (Priority 1)
      ansible.builtin.shell: |
        # Use -I (Insert) to ensure these are the very first rules evaluated
        iptables -t mangle -I OUTPUT -p tcp --sport 22 -j MARK --set-mark 10 || true
        iptables -t mangle -I OUTPUT -p tcp --dport 22 -j MARK --set-mark 10 || true
      changed_when: false

    - name: Clear existing network rules (Cleanup)
      # We use async here because 'tc qdisc del' can cause a momentary reset of the link
      # which often kills the very SSH connection Ansible is using.
      ansible.builtin.shell: |
        tc qdisc del dev {{ network.interface }} root 2>/dev/null || true
        iptables -t mangle -F 2>/dev/null || true
        # Re-apply SSH protection immediately after flush
        iptables -t mangle -I OUTPUT -p tcp --sport 22 -j MARK --set-mark 10
        iptables -t mangle -I OUTPUT -p tcp --dport 22 -j MARK --set-mark 10
      async: 30
      poll: 5
      changed_when: false

    - name: Set node region facts
      ansible.builtin.set_fact:
        # Detect region based on inventory groups (with hyphens)
        my_region: "{{ 'arizona' if inventory_hostname in groups['arizona'] or inventory_hostname in groups['az-cluster-1'] or inventory_hostname in groups['az-cluster-2'] else 'texas' }}"
        other_region: "{{ 'texas' if inventory_hostname in groups['arizona'] or inventory_hostname in groups['az-cluster-1'] or inventory_hostname in groups['az-cluster-2'] else 'arizona' }}"

    - name: Setup TC structure and latency bands
      ansible.builtin.shell: |
        # Setup root qdisc
        tc qdisc add dev {{ network.interface }} root handle 1: prio bands 4
        
        # Setup Band 2 (Metro)
        tc qdisc add dev {{ network.interface }} parent 1:2 handle 20: \
          netem delay {{ latency.metro.delay_ms }}ms {{ latency.metro.jitter_ms }}ms distribution normal
        
        # Setup Band 3 (Cross-Region)
        tc qdisc add dev {{ network.interface }} parent 1:3 handle 30: \
          netem delay {{ latency.cross_region.delay_ms }}ms {{ latency.cross_region.jitter_ms }}ms distribution normal
        
        # Priority Filter for SSH (Mark 10 -> Band 1)
        tc filter add dev {{ network.interface }} protocol ip parent 1:0 prio 1 handle 10 fw flowid 1:1
      changed_when: true

    - name: Apply latency filters to all peers (Batch mode)
      ansible.builtin.shell: |
        # Apply metro latency to nodes in my region
        {% for host in groups[my_region] %}
        {% set ip = hostvars[host]['ansible_host'] %}
        {% if ip != hostvars[inventory_hostname]['ansible_host'] %}
        tc filter add dev {{ network.interface }} parent 1:0 protocol ip prio 2 u32 match ip dst {{ ip }}/32 flowid 1:2
        {% endif %}
        {% endfor %}

        # Apply cross-region latency to nodes in other region
        {% for host in groups[other_region] %}
        {% set ip = hostvars[host]['ansible_host'] %}
        tc filter add dev {{ network.interface }} parent 1:0 protocol ip prio 3 u32 match ip dst {{ ip }}/32 flowid 1:3
        {% endfor %}
      changed_when: true

    - name: Verify TC configuration
      ansible.builtin.command: tc qdisc show dev {{ network.interface }}
      register: tc_verify
      changed_when: false

    - name: Display TC status
      ansible.builtin.debug:
        var: tc_verify.stdout_lines