---
# Tanzu RabbitMQ Warm Standby Replication Configuration
#
# PREREQUISITE: Admin user MUST be created first via configure_admin_user.yml
#
# Fan-out topology from AZ-Cluster-1 (upstream):
#   AZ-Cluster-1 → AZ-Cluster-2  (AZ region standby)
#   AZ-Cluster-1 → TX-Cluster-1  (cross-region DR)
#
# Failover scenarios:
#   AZ-Cluster-1 failure  → Promote AZ-Cluster-2
#   Arizona region failure → Promote TX-Cluster-1
#
# Two subsystems work together:
#   1. Schema Definition Sync   - replicates vhosts, users, queues, exchanges, policies (AMQP TLS port 5671)
#   2. Standby Message Replication - replicates messages via streams (stream TLS port 5551)

# ============================================
# Phase 1: Enable required plugins on all nodes
# ============================================
- name: Enable warm standby plugins on all nodes
  hosts: nodes
  become: true
  tasks:
    - name: Enable management plugin
      ansible.builtin.command: rabbitmq-plugins enable rabbitmq_management
      register: result
      changed_when: "'already enabled' not in result.stdout"

    - name: Enable stream plugins
      ansible.builtin.command: rabbitmq-plugins enable rabbitmq_stream rabbitmq_stream_management
      register: result
      changed_when: "'already enabled' not in result.stdout"

    - name: Enable schema definition sync plugins
      ansible.builtin.command: >
        rabbitmq-plugins enable
        rabbitmq_schema_definition_sync
        rabbitmq_schema_definition_sync_prometheus
      register: result
      changed_when: "'already enabled' not in result.stdout"

    - name: Enable standby replication plugin
      ansible.builtin.command: rabbitmq-plugins enable rabbitmq_standby_replication
      register: result
      changed_when: "'already enabled' not in result.stdout"

# ============================================
# Phase 2: Configure upstream cluster (AZ-Cluster-1) config and restart
# ============================================
- name: Configure upstream cluster (AZ-Cluster-1) config
  hosts: az-cluster-1
  become: true
  serial: 1
  tasks:
    - name: Set schema_definition_sync operating mode to upstream
      ansible.builtin.lineinfile:
        path: /etc/rabbitmq/rabbitmq.conf
        line: "schema_definition_sync.operating_mode = upstream"
        regexp: '^schema_definition_sync\.operating_mode'
        create: true
        owner: rabbitmq
        group: rabbitmq
        mode: '0644'

    - name: Server Certificate File for Schema Definition Sync
      ansible.builtin.lineinfile:
        path: /etc/rabbitmq/rabbitmq.conf
        line: "schema_definition_sync.ssl_options.certfile = /etc/rabbitmq/tls/server.crt"
        regexp: '^schema_definition_sync\.ssl_options\.certfile'
        create: true
        owner: rabbitmq
        group: rabbitmq
        mode: '0644'    

    - name: Server Key File for Schema Definition Sync
      ansible.builtin.lineinfile:
        path: /etc/rabbitmq/rabbitmq.conf
        line: "schema_definition_sync.ssl_options.keyfile = /etc/rabbitmq/tls/server.key"
        regexp: '^schema_definition_sync\.ssl_options\.keyfile'
        create: true
        owner: rabbitmq
        group: rabbitmq
        mode: '0644'   

    - name: Verify Peer for Schema Definition Sync
      ansible.builtin.lineinfile:
        path: /etc/rabbitmq/rabbitmq.conf
        line: "schema_definition_sync.ssl_options.verify = verify_none"
        regexp: '^schema_definition_sync\.ssl_options\.verify'
        create: true
        owner: rabbitmq
        group: rabbitmq
        mode: '0644'   


    - name: Fail if no Peer certificate for Schema Definition Sync
      ansible.builtin.lineinfile:
        path: /etc/rabbitmq/rabbitmq.conf
        line: "schema_definition_sync.ssl_options.fail_if_no_peer_cert = false"
        regexp: '^schema_definition_sync\.ssl_options\.fail_if_no_peer_cert'
        create: true
        owner: rabbitmq
        group: rabbitmq
        mode: '0644'   

    - name: Set standby replication operating mode to upstream
      ansible.builtin.lineinfile:
        path: /etc/rabbitmq/rabbitmq.conf
        line: "standby.replication.operating_mode = upstream"
        regexp: '^standby\.replication\.operating_mode'
        create: true
        owner: rabbitmq
        group: rabbitmq
        mode: '0644'

    - name: Set standby replication retention size limit
      ansible.builtin.lineinfile:
        path: /etc/rabbitmq/rabbitmq.conf
        line: "standby.replication.retention.size_limit.messages = 5000000000"
        regexp: '^standby\.replication\.retention\.size_limit\.messages'
        create: true
        owner: rabbitmq
        group: rabbitmq
        mode: '0644'

    - name: Restart RabbitMQ to apply config
      ansible.builtin.systemd:
        name: tanzu-rabbitmq-server
        state: restarted

    - name: Wait for RabbitMQ to be ready
      ansible.builtin.command: rabbitmqctl await_startup
      timeout: 120
      changed_when: false
      retries: 5
      delay: 10
      register: result
      until: result.rc == 0

# ============================================
# Phase 3: Create replication user on ALL clusters
# ============================================
- name: Create replication user on all clusters
  hosts: pve-schwab-rmq01,pve-schwab-rmq04,pve-schwab-rmq07
  become: true
  vars:
    rmq_password: "{{ vault_rmq_admin_password | default('changeme') }}"
  tasks:
    - name: Create schema definition sync internal vhost
      ansible.builtin.command: rabbitmqctl add_vhost rabbitmq_schema_definition_sync
      register: result
      changed_when: result.rc == 0
      failed_when: result.rc != 0 and 'already exists' not in result.stderr

    - name: Create replication user (regular user, not schema_replication_user)
      ansible.builtin.command: >
        rabbitmqctl add_user {{ rabbitmq.replication_user }} {{ rmq_password }}
      register: result
      changed_when: result.rc == 0
      failed_when: result.rc != 0 and 'already exists' not in result.stderr

    - name: Set replication user tags
      ansible.builtin.command: rabbitmqctl set_user_tags {{ rabbitmq.replication_user }} administrator
      changed_when: true

    - name: Set replication user permissions on default vhost
      ansible.builtin.command: >
        rabbitmqctl set_permissions -p / {{ rabbitmq.replication_user }} ".*" ".*" ".*"
      changed_when: true

    - name: Set replication user permissions on schema sync vhost
      ansible.builtin.command: >
        rabbitmqctl set_permissions -p rabbitmq_schema_definition_sync {{ rabbitmq.replication_user }} ".*" ".*" ".*"
      changed_when: true

# ============================================
# Phase 4: Configure upstream replication settings
# ============================================
- name: Configure upstream cluster replication
  hosts: pve-schwab-rmq01
  become: true
  vars:
    rmq_password: "{{ vault_rmq_admin_password | default('changeme') }}"
    upstream_endpoints_list:
      - "{{ hostvars[groups['az-cluster-1'][0]]['ansible_host'] }}:5671"
      - "{{ hostvars[groups['az-cluster-1'][1]]['ansible_host'] }}:5671"
      - "{{ hostvars[groups['az-cluster-1'][2]]['ansible_host'] }}:5671"
  tasks:

    - name: Set schema replication upstream endpoints on upstream
      ansible.builtin.command: >
        rabbitmqctl set_schema_replication_upstream_endpoints 
        '{{ {"endpoints": upstream_endpoints_list, "username": rabbitmq.replication_user, "password": rmq_password} | to_json }}'
      changed_when: true

    - name: Tag default vhost for standby replication
      ansible.builtin.command: >
        rabbitmqctl update_vhost_metadata / --tags "standby_replication"
      changed_when: true

    - name: Set replication policy for all queues
      ansible.builtin.command: >
        rabbitmqctl set_policy --vhost / standby-replication
        "^.*" '{"remote-dc-replicate":true}' --apply-to queues
      changed_when: true

    - name: Verify upstream standby replication status
      ansible.builtin.command: rabbitmqctl standby_replication_status
      register: upstream_status
      changed_when: false
      ignore_errors: true

    - name: Display upstream status
      ansible.builtin.debug:
        msg: "{{ upstream_status.stdout_lines | default(['Status not available']) }}"

# ============================================
# Phase 5: Write downstream config (all nodes, no restart yet)
# ============================================
- name: Write downstream cluster config
  hosts: az-cluster-2:tx-cluster-1
  become: true
  tasks:
    - name: Set schema_definition_sync operating mode to downstream
      ansible.builtin.lineinfile:
        path: /etc/rabbitmq/rabbitmq.conf
        line: "schema_definition_sync.operating_mode = downstream"
        regexp: '^schema_definition_sync\.operating_mode'
        create: true
        owner: rabbitmq
        group: rabbitmq
        mode: '0644'

    - name: Set schema sync minimum interval
      ansible.builtin.lineinfile:
        path: /etc/rabbitmq/rabbitmq.conf
        line: "schema_definition_sync.downstream.minimum_sync_interval = 30"
        regexp: '^schema_definition_sync\.downstream\.minimum_sync_interval'
        create: true
        owner: rabbitmq
        group: rabbitmq
        mode: '0644'

    - name: Preserve standby replication global parameters across sync
      ansible.builtin.lineinfile:
        path: /etc/rabbitmq/rabbitmq.conf
        line: "schema_definition_sync.downstream.locals.global_parameters = ^standby"
        regexp: '^schema_definition_sync\.downstream\.locals\.global_parameters'
        create: true
        owner: rabbitmq
        group: rabbitmq
        mode: '0644'

    - name: CA Certificate File for Schema Definition Sync
      ansible.builtin.lineinfile:
        path: /etc/rabbitmq/rabbitmq.conf
        line: "schema_definition_sync.ssl_options.cacertfile = /etc/rabbitmq/tls/ca.crt"
        regexp: '^schema_definition_sync\.ssl_options\.cacertfile'
        create: true
        owner: rabbitmq
        group: rabbitmq
        mode: '0644'    
    
    - name: Server Certificate File for Schema Definition Sync
      ansible.builtin.lineinfile:
        path: /etc/rabbitmq/rabbitmq.conf
        line: "schema_definition_sync.ssl_options.certfile = /etc/rabbitmq/tls/server.crt"
        regexp: '^schema_definition_sync\.ssl_options\.certfile'
        create: true
        owner: rabbitmq
        group: rabbitmq
        mode: '0644'    

    - name: Server Key File for Schema Definition Sync
      ansible.builtin.lineinfile:
        path: /etc/rabbitmq/rabbitmq.conf
        line: "schema_definition_sync.ssl_options.keyfile = /etc/rabbitmq/tls/server.key"
        regexp: '^schema_definition_sync\.ssl_options\.keyfile'
        create: true
        owner: rabbitmq
        group: rabbitmq
        mode: '0644'   

    - name: Verify Peer for Schema Definition Sync
      ansible.builtin.lineinfile:
        path: /etc/rabbitmq/rabbitmq.conf
        line: "schema_definition_sync.ssl_options.verify = verify_none"
        regexp: '^schema_definition_sync\.ssl_options\.verify'
        create: true
        owner: rabbitmq
        group: rabbitmq
        mode: '0644'   


    - name: Fail if no Peer certificate for Schema Definition Sync
      ansible.builtin.lineinfile:
        path: /etc/rabbitmq/rabbitmq.conf
        line: "schema_definition_sync.ssl_options.fail_if_no_peer_cert = false"
        regexp: '^schema_definition_sync\.ssl_options\.fail_if_no_peer_cert'
        create: true
        owner: rabbitmq
        group: rabbitmq
        mode: '0644'   

    - name: Set standby replication operating mode to downstream
      ansible.builtin.lineinfile:
        path: /etc/rabbitmq/rabbitmq.conf
        line: "standby.replication.operating_mode = downstream"
        regexp: '^standby\.replication\.operating_mode'
        create: true
        owner: rabbitmq
        group: rabbitmq
        mode: '0644'

    - name: Set standby replication retention size limit
      ansible.builtin.lineinfile:
        path: /etc/rabbitmq/rabbitmq.conf
        line: "standby.replication.retention.size_limit.messages = 5000000000"
        regexp: '^standby\.replication\.retention\.size_limit\.messages'
        create: true
        owner: rabbitmq
        group: rabbitmq
        mode: '0644'

    - name: CA Certificate File for Standby Replication
      ansible.builtin.lineinfile:
        path: /etc/rabbitmq/rabbitmq.conf
        line: "standby.replication.downstream.ssl_options.cacertfile = /etc/rabbitmq/tls/ca.crt"
        regexp: '^standby\.replication\.downstream\.ssl_options\.cacertfile'
        create: true
        owner: rabbitmq
        group: rabbitmq
        mode: '0644'    
    
    - name: Server Certificate File for Standby Replication
      ansible.builtin.lineinfile:
        path: /etc/rabbitmq/rabbitmq.conf
        line: "standby.replication.downstream.ssl_options.certfile = /etc/rabbitmq/tls/server.crt"
        regexp: '^standby\.replication\.downstream\.ssl_options\.certfile'
        create: true
        owner: rabbitmq
        group: rabbitmq
        mode: '0644'    

    - name: Server Key File for Standby Replication
      ansible.builtin.lineinfile:
        path: /etc/rabbitmq/rabbitmq.conf
        line: "standby.replication.downstream.ssl_options.keyfile = /etc/rabbitmq/tls/server.key"
        regexp: '^standby\.replication\.downstream\.ssl_options\.keyfile'
        create: true
        owner: rabbitmq
        group: rabbitmq
        mode: '0644'   

    - name: Verify Peer for Standby Replication
      ansible.builtin.lineinfile:
        path: /etc/rabbitmq/rabbitmq.conf
        line: "standby.replication.downstream.ssl_options.verify = verify_none"
        regexp: '^standby\.replication\.downstream\.ssl_options\.verify'
        create: true
        owner: rabbitmq
        group: rabbitmq
        mode: '0644'   


    - name: Fail if no Peer certificate for Standby Replication
      ansible.builtin.lineinfile:
        path: /etc/rabbitmq/rabbitmq.conf
        line: "standby.replication.downstream.ssl_options.fail_if_no_peer_cert = false"
        regexp: '^standby\.replication\.downstream\.ssl_options\.fail_if_no_peer_cert'
        create: true
        owner: rabbitmq
        group: rabbitmq
        mode: '0644'   

# ============================================
# Phase 6: Set schema replication endpoints BEFORE restart
# ============================================
- name: Set schema replication endpoints on all downstreams (pre-restart)
  hosts: pve-schwab-rmq04,pve-schwab-rmq07
  become: true
  vars:
    rmq_password: "{{ vault_rmq_admin_password | default('changeme') }}"
    upstream_endpoints_list:
      - "{{ hostvars[groups['az-cluster-1'][0]]['ansible_host'] }}:5671"
      - "{{ hostvars[groups['az-cluster-1'][1]]['ansible_host'] }}:5671"
      - "{{ hostvars[groups['az-cluster-1'][2]]['ansible_host'] }}:5671"
  tasks:
    - name: Set schema replication upstream endpoints (AMQP TLS port 5671)
      ansible.builtin.shell: >
        rabbitmqctl set_schema_replication_upstream_endpoints
        '{{ {"endpoints": upstream_endpoints_list, "username": rabbitmq.replication_user, "password": rmq_password} | to_json }}'
      changed_when: true

    - name: Verify schema endpoints were stored
      ansible.builtin.command: rabbitmqctl list_global_parameters
      register: global_params
      changed_when: false

    - name: Display global parameters
      ansible.builtin.debug:
        var: global_params.stdout_lines

# ============================================
# Phase 7: Restart downstream nodes (rolling)
# ============================================
- name: Restart downstream clusters
  hosts: az-cluster-2:tx-cluster-1
  become: true
  serial: 1
  tasks:
    - name: Restart RabbitMQ to apply config
      ansible.builtin.systemd:
        name: tanzu-rabbitmq-server
        state: restarted

    - name: Wait for RabbitMQ to be ready
      ansible.builtin.command: rabbitmqctl await_startup
      timeout: 120
      changed_when: false
      retries: 5
      delay: 10
      register: result
      until: result.rc == 0

# ============================================
# Phase 8: Connect standby replication and verify
# ============================================
- name: Connect all downstreams to upstream
  hosts: pve-schwab-rmq04,pve-schwab-rmq07
  become: true
  vars:
    rmq_password: "{{ vault_rmq_admin_password | default('changeme') }}"
    # Defined as a proper YAML list to ensure correct JSON encoding
    upstream_stream_endpoints_list:
      - "{{ hostvars[groups['az-cluster-1'][0]]['ansible_host'] }}:5551"
      - "{{ hostvars[groups['az-cluster-1'][1]]['ansible_host'] }}:5551"
      - "{{ hostvars[groups['az-cluster-1'][2]]['ansible_host'] }}:5551"
  tasks:
    - name: Set standby replication upstream endpoints (stream TLS port 5551)
      ansible.builtin.shell: >
        rabbitmqctl set_standby_replication_upstream_endpoints
        '{{ {"endpoints": upstream_stream_endpoints_list, "username": rabbitmq.replication_user, "password": rmq_password} | to_json }}'
      register: standby_result
      changed_when: true

    - name: Show standby replication result
      ansible.builtin.debug:
        var: standby_result

    - name: Connect standby replication downstream
      ansible.builtin.command: rabbitmqctl connect_standby_replication_downstream
      register: connect_result
      changed_when: true

    - name: Show connect result
      ansible.builtin.debug:
        var: connect_result

    - name: Wait for schema replication to connect
      ansible.builtin.command: rabbitmqctl schema_replication_status
      register: verify_result
      changed_when: false
      retries: 12
      delay: 10
      until: >
        'running' in verify_result.stdout or
        'syncing' in verify_result.stdout

    - name: Show schema replication status
      ansible.builtin.debug:
        var: verify_result.stdout_lines

# ============================================
# Phase 9: Verify replication status
# ============================================
- name: Verify all downstream replication
  hosts: pve-schwab-rmq04,pve-schwab-rmq07
  become: true
  tasks:
    - name: Check standby replication status
      ansible.builtin.command: rabbitmqctl standby_replication_status
      register: replication_status
      changed_when: false
      ignore_errors: true

    - name: Display standby replication status
      ansible.builtin.debug:
        msg: "{{ replication_status.stdout_lines | default(['Status not available']) }}"

    - name: Check schema replication status
      ansible.builtin.command: rabbitmqctl schema_replication_status
      register: schema_status
      changed_when: false
      ignore_errors: true

    - name: Display schema replication status
      ansible.builtin.debug:
        msg: "{{ schema_status.stdout_lines | default(['Status not available']) }}"

    - name: List vhosts available for recovery
      ansible.builtin.command: rabbitmqctl list_vhosts_available_for_standby_replication_recovery
      register: recovery_vhosts
      changed_when: false
      ignore_errors: true

    - name: Display vhosts available for recovery
      ansible.builtin.debug:
        msg: "{{ recovery_vhosts.stdout_lines | default(['None available']) }}"

# ============================================
# Phase 10: Display summary
# ============================================
- name: Display Summary
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Print configuration summary
      ansible.builtin.debug:
        msg:
          - "============================================"
          - "Warm Standby Replication Configuration Complete"
          - "============================================"
          - ""
          - "Topology (fan-out from AZ-Cluster-1):"
          - "  AZ-Cluster-1 (upstream) → AZ-Cluster-2 (AZ region standby)"
          - "  AZ-Cluster-1 (upstream) → TX-Cluster-1 (cross-region DR)"
          - ""
          - "Users Created:"
          - "  admin: Administrator user on all clusters"
          - "  replication: Schema/standby replication user on all clusters"
          - "  guest: Deleted for security"
          - ""
          - "What is replicated:"
          - "  Schema:   vhosts, users, queues, exchanges, policies (via schema_definition_sync over TLS port 5671)"
          - "  Messages: queue contents (via standby_replication, stream TLS port 5551)"
          - ""
          - "Upstream Cluster:"
          - "  AZ-Cluster-1: {{ groups['az-cluster-1'] | join(', ') }}"
          - ""
          - "Downstream Clusters:"
          - "  AZ-Cluster-2: {{ groups['az-cluster-2'] | join(', ') }}"
          - "  TX-Cluster-1: {{ groups['tx-cluster-1'] | join(', ') }}"
          - ""
          - "Failover:"
          - "  AZ-Cluster-1 failure  → Promote AZ-Cluster-2"
          - "  Arizona region failure → Promote TX-Cluster-1"
          - "  Command: rabbitmqctl promote_warm_standby"
          - ""
          - "Management UIs (TLS):"
          - "  AZ-Cluster-1: https://{{ hostvars[groups['az-cluster-1'][0]]['ansible_host'] }}:15671"
          - "  AZ-Cluster-2: https://{{ hostvars[groups['az-cluster-2'][0]]['ansible_host'] }}:15671"
          - "  TX-Cluster-1: https://{{ hostvars[groups['tx-cluster-1'][0]]['ansible_host'] }}:15671"
          - ""
          - "Verify replication:"
          - "  rabbitmqctl standby_replication_status"
          - "  rabbitmqctl schema_replication_status"
          - "  rabbitmqctl list_vhosts_available_for_standby_replication_recovery"
          - "============================================"
