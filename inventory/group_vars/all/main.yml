# Environment Configuration
# Non-secret variables for the lab environment

# ===========================================
# Network Configuration
# ===========================================
network:
  interface: "ens33"
  gateway: "10.85.10.193"
  dns_servers:
    - "192.19.189.10"
    - "192.19.189.20"
  domain: "acc.broadcom.net"

# ===========================================
# Latency Simulation (tc/netem)
# ===========================================
latency:
  metro:
    delay_ms: 1.5
    jitter_ms: 0.5
  cross_region:
    delay_ms: 15
    jitter_ms: 2


# ===========================================
# RabbitMQ Configuration
# ===========================================
rabbitmq:
  admin_user: "admin"
  replication_user: "replication"
  amqp_port: 5672
  management_port: 15672
  clustering_port: 25672
  epmd_port: 4369
  stream_metadata_dir: "/app/rabbitmq_stream_metadata"
  metadata_dir: "/app/rabbitmq_metadata"