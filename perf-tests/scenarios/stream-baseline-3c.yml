# Basic Stream Performance Test
# Single publisher, single consumer, stream queue
# Use this to test basic stream performance

name: stream-baseline
description: "Basic stream test - 1 pub, 1 con, 1KB messages"
type: amqp

# Test duration
duration: 120

# Publisher settings
publishers: 1
pub_rate: 0  # 0 = unlimited

# Consumer settings
consumers: 3
consumer_rate: 0  # 0 = unlimited

# Message settings
message_size: 1000  # 1KB
confirm: 100       # Publisher confirmation frequency
qos: 200           # Consumer prefetch count

# Queue settings
queue_type: stream  # Use stream queues
offset: last        # Start consuming from the next message
