# Baseline Performance Test
# Single publisher, single consumer, small messages
# Use this to establish baseline performance metrics

name: baseline
description: "Baseline test - 1 pub, 1 con, 1KB messages"
type: amqp

# Test duration
duration: 30

# Publisher settings
publishers: 10
pub_rate: 0  # 0 = unlimited

# Consumer settings
consumers: 10
consumer_rate: 0  # 0 = unlimited

# Message settings
message_size: 1000  # 1KB
confirm: 100        # Publisher confirmation frequency (integer)
multi_ack_every: 100  # Consumer acknowledgment frequency (mutually exclusive with autoack)
# autoack: true     # Auto-acknowledge messages (true/false, mutually exclusive with multi_ack_every)
qos: 200             # Consumer prefetch count

# Queue settings
queue_type: quorum  # classic, quorum, or stream
queue_args:
  x-quorum-initial-group-size: 3
